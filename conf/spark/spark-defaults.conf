# Spark Configuration for S3A and Hive Integration

# S3A / MinIO Configuration
spark.hadoop.fs.s3a.endpoint                    http://minio:9000
spark.hadoop.fs.s3a.access.key                  admin
spark.hadoop.fs.s3a.secret.key                  admin123
spark.hadoop.fs.s3a.path.style.access           true
spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled      false
spark.hadoop.fs.s3a.aws.credentials.provider    org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# Hive Configuration
spark.sql.warehouse.dir                         /tmp/spark-warehouse
spark.sql.hive.metastore.version               3.1.3
spark.sql.hive.metastore.jars                  /opt/spark/jars/*
spark.sql.catalogImplementation                 hive

# Parquet compatibility with Hive 2.3.9 reader:
#   - writeLegacyFormat=true forces DECIMAL to FIXED_LEN_BYTE_ARRAY (Hive 2.x can't
#     read INT32/INT64-encoded decimals that newer Spark writes by default).
#   - outputTimestampType=INT96 forces timestamps to the legacy INT96 layout that
#     Hive 2.x expects (default is TIMESTAMP_MICROS which Hive 2.x mis-reads).
spark.sql.parquet.writeLegacyFormat             true
spark.sql.parquet.outputTimestampType           INT96

# Performance tuning
spark.sql.adaptive.enabled                      true
spark.sql.adaptive.coalescePartitions.enabled   true
spark.serializer                                org.apache.spark.serializer.KryoSerializer

# S3A Performance optimizations
spark.hadoop.fs.s3a.connection.maximum          100
spark.hadoop.fs.s3a.threads.max                 20
spark.hadoop.fs.s3a.connection.establish.timeout 5000
spark.hadoop.fs.s3a.connection.timeout          200000
spark.hadoop.fs.s3a.fast.upload                 true
